   player.hp=Math.min(100,player.hp+DEBUGGER_HEAL);healthUI();
   spark(d.m.position.clone(),0x65ffdd,20);
   d.ready=false;d.respawn=DEBUGGER_RESPAWN;d.m.visible=false;
  }
 }
 document.getElementById('debuggerCount').textContent='DEBUGGER '+debuggers.filter(d=>d.ready).length+' / '+DEBUGGER_MAX+' · +'+DEBUGGER_HEAL+' HP';
}
const avatar=new T.Mesh(new T.SphereGeometry(.46,20,16),new T.MeshBasicMaterial({color:0xff264f}));scene.add(avatar);avatar.visible=false;
const pointer={x:0,y:0,px:innerWidth/2,py:innerHeight/2};
const aim=document.getElementById('aim'),mode=document.getElementById('mode');aim.style.left='50%';aim.style.top='50%';
function surfacePoint(s,p){return s==='back'?new T.Vector3(p.x,p.y,-17.35):s==='left'?new T.Vector3(-17.35,p.y,p.z):new T.Vector3(p.x,.12,p.z)}
function sync2(){
 const a=avatar.position, n=player.normal;
 cam2.up.copy(Math.abs(n.y)>.8?new T.Vector3(0,0,-1):new T.Vector3(0,1,0));
 cam2.position.copy(a).addScaledVector(n,18);cam2.lookAt(a);cam2.updateProjectionMatrix()
}
function toggle(){
 player.flat=!player.flat;mode.textContent=player.flat?'2D MODE / SURFACE':'3D MODE';
 if(player.flat){
  // Raycast from the FPS view, falling back to the nearest visible surface.
  let forward=new T.Vector3(0,0,-1).applyQuaternion(cam3.quaternion);
  ray.set(cam3.position,forward);ray.far=8;
  let hit=ray.intersectObjects(obstacles,false)[0];
  if(!hit){
   let p=cam3.position;
   let candidates=[{d:p.y,n:new T.Vector3(0,1,0),pt:new T.Vector3(p.x,0,p.z),obj:null}];
   for(let m of [...blocks,...formations]){let b=new T.Box3().setFromObject(m),q=b.clampPoint(p,new T.Vector3());let delta=p.clone().sub(q);if(delta.length()>.01)candidates.push({d:delta.length(),n:delta.normalize(),pt:q,obj:m})}
   candidates.sort((a,b)=>a.d-b.d);let c=candidates[0];player.normal=c.n;player.anchor=c.pt;player.surfaceObj=c.obj;
  }else{
   player.normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
   player.anchor=hit.point.clone();player.surfaceObj=hit.object;
  }
  player.normal.normalize();
  player.u=new T.Vector3().crossVectors(Math.abs(player.normal.y)>.8?new T.Vector3(0,0,-1):new T.Vector3(0,1,0),player.normal).normalize();
  player.v=new T.Vector3().crossVectors(player.normal,player.u).normalize();
  player.flatPos=player.anchor.clone().addScaledVector(player.normal,.12);
  avatar.position.copy(player.flatPos);avatar.visible=true;cam=cam2;visibility2D(true);sync2();aim.style.left=pointer.px+'px';aim.style.top=pointer.py+'px';document.exitPointerLock?.();
 }else{visibility2D(false);cam=cam3;avatar.visible=false;aim.style.left='50%';aim.style.top='50%';cam3.position.copy(avatar.position).addScaledVector(player.normal,1.5);cam3.position.y=Math.max(1.7,cam3.position.y);player.vy=0;renderer.domElement.requestPointerLock?.()}
}
function spark(pos,color,n=12){
 for(let i=0;i<n;i++){
  const m=new T.Mesh(new T.BoxGeometry(.075,.075,.075),new T.MeshBasicMaterial({color,depthTest:false}));
  m.position.copy(pos);
  m.userData={life:.28+Math.random()*.2,v:new T.Vector3((Math.random()-.5)*6,(Math.random()-.5)*6,(Math.random()-.5)*6)};
  scene.add(m);effects.push(m);
 }
}
function line(a,b,color=0xffffaa){
 const m=new T.Line(new T.BufferGeometry().setFromPoints([a.clone(),b.clone()]),
  new T.LineBasicMaterial({color,transparent:true,opacity:1,depthTest:false}));
 m.userData={life:.22};
 m.renderOrder=20;
 scene.add(m);effects.push(m);
}
// Moving eight-sided neon energy bolts, distinct from the player's shotgun tracers.
function sameSurface(e){
 if(!player.flat||e.type!==2)return false;
 const n=new T.Vector3(0,0,1).applyQuaternion(e.m.quaternion).normalize();
 if(Math.abs(n.dot(player.normal))<.97)return false;
 const planeDistance=Math.abs(e.m.position.clone().sub(player.anchor).dot(player.normal));
 if(planeDistance>.38)return false;
 if(e.s==='floor')return player.surfaceObj===null;
 return player.surfaceObj!==null && new T.Box3().setFromObject(player.surfaceObj).distanceToPoint(e.m.position)<.35;
}
function enemyBolt(start,end,type,willHit,damage,sourceEnemy=null){
 const delta=end.clone().sub(start),distance=delta.length();
 if(distance<.05)return;
 const color=type===2?0xfff7cf:0xff357e;
 const group=new T.Group();
 const core=new T.Mesh(new T.CylinderGeometry(.13,.13,.72,8),
  new T.MeshBasicMaterial({color,transparent:type===2,opacity:type===2?.72:1,depthTest:false}));
 const glow=new T.Mesh(new T.CylinderGeometry(.25,.25,.84,8),
  new T.MeshBasicMaterial({color,transparent:true,opacity:type===2?.13:.23,depthWrite:false,depthTest:false}));
 group.add(glow,core);
 group.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.clone().normalize());
 group.position.copy(start);group.renderOrder=25;
 scene.add(group);
 effects.push(group);
 group.userData={life:Math.max(.12,distance/24),bolt:true,start:start.clone(),end:end.clone(),
  elapsed:0,duration:Math.max(.12,distance/24),willHit,damage,color,sourceEnemy};
}
function shoot(){if(!running||paused)return;beep();let a,dir;
if(player.flat){a=avatar.position.clone();let ndc=new T.Vector2(pointer.x,pointer.y);ray.setFromCamera(ndc,cam2);let plane=new T.Plane();plane.setFromNormalAndCoplanarPoint(player.normal,a);let target=new T.Vector3();if(!ray.ray.intersectPlane(plane,target))return;dir=target.sub(a).normalize();if(dir.lengthSq()<.001)return;a.addScaledVector(dir,.5)}
else{a=cam3.position.clone();dir=new T.Vector3(0,0,-1).applyQuaternion(cam3.quaternion)}
spark(a.clone().addScaledVector(dir,.8),0xffffaa,10);for(let i=0;i<9;i++){if(gameOver)break;let d=dir.clone();if(player.flat){d.addScaledVector(player.normal,0);d.applyAxisAngle(player.normal,(Math.random()-.5)*.16)}else d.add(new T.Vector3((Math.random()-.5)*.13,(Math.random()-.5)*.13,(Math.random()-.5)*.13)).normalize();
let best=22,hit=null,point=null;
ray.set(a,d);ray.far=22;let obs=ray.intersectObjects(obstacles.filter(o=>!player.flat||o!==player.surfaceObj),false)[0];if(obs){best=obs.distance;point=obs.point}
for(const e of enemies){if(e.hp<=0||e.type!==(player.flat?2:3)||player.flat&&Math.abs(e.m.position.clone().sub(player.anchor).dot(player.normal))>.85)continue;let t=e.m.position.clone().sub(a),along=t.dot(d),perp=t.clone().addScaledVector(d,-along).length();if(along>0&&along<best&&perp<(e.type===2?.75:.75)){best=along;hit=e;point=a.clone().addScaledVector(d,along)}}
let end=point||a.clone().addScaledVector(d,22);line(a,end,0xffffaa);if(hit){hit.hp--;spark(end,hit.type===2?0x55ff99:0xff2366,4);if(hit.hp<=0){kills++;hit.m.visible=false;spark(end,0xffffff,25);if(kills===enemies.length)endGame(true)}}else if(point)spark(point,0x00ffff,2)}
}
function hurt(n){if(gameOver||paused||!running||performance.now()-lastDamageAt<1800)return;lastDamageAt=performance.now();player.hp=Math.max(0,player.hp-n);healthUI();document.getElementById('flash').style.opacity='.2';setTimeout(()=>document.getElementById('flash').style.opacity='0',100);if(player.hp===0)endGame(false)}

function update(dt){updateDebuggers(dt);let p=cam3.position;
if(player.flat){let dx=(+!!keys.KeyD-+!!keys.KeyA)*dt*6,dy=(+!!keys.KeyW-+!!keys.KeyS)*dt*6;let next=player.flatPos.clone().addScaledVector(player.u,dx).addScaledVector(player.v,dy);let bounds=player.surfaceObj?new T.Box3().setFromObject(player.surfaceObj):new T.Box3(new T.Vector3(-90,.1,-90),new T.Vector3(90,11,90));let q=bounds.clone().expandByScalar(.4);if(q.containsPoint(next)){player.flatPos.copy(next);avatar.position.copy(next)}sync2()}
else{let f=new T.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),r=new T.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),v=new T.Vector3();if(keys.KeyW)v.add(f);if(keys.KeyS)v.sub(f);if(keys.KeyD)v.add(r);if(keys.KeyA)v.sub(r);if(v.length())v.normalize().multiplyScalar(dt*7);let next=p.clone();next.x+=v.x;if(!collides(next))p.x=next.x;next.copy(p);next.z+=v.z;if(!collides(next))p.z=next.z;if(keys.Space&&player.ground){player.vy=7;player.ground=false}player.vy-=20*dt;p.y+=player.vy*dt;if(p.y<1.7){p.y=1.7;player.vy=0;player.ground=true}}
for(const e of enemies){if(e.hp<=0)continue;e.cool-=dt;if(e.type===3){let toward=p.clone().sub(e.m.position);toward.y=0;if(toward.length()<17&&toward.length()>2){let step=toward.normalize().multiplyScalar(dt*.9),n=e.m.position.clone().add(step);if(!collides(n,.8))e.m.position.copy(n)}e.m.rotation.y+=dt}else{e.m.material.opacity=.9}
if(e.cool<=0){e.cool=e.type===2?3.8:3.2;if(e.type===3&&player.flat)continue;
if(e.type===2&&!player.flat)continue; // 2D enemies never target the 3D player.
let a=e.m.position.clone();
const onSameFace=e.type===2&&sameSurface(e);
let b=e.type===2&&!onSameFace?a.clone().add(new T.Vector3(0,0,7)):player.flat?avatar.position.clone():p.clone();if(a.distanceTo(b)<30){let source=e.type===2?obstacles.find(o=>new T.Box3().setFromObject(o).distanceToPoint(a)<.25):null;let dir=b.clone().sub(a),dist=dir.length();dir.normalize();let origin=a.clone().addScaledVector(dir,.18);ray.set(origin,dir);ray.far=Math.max(0,dist-.3);let impact=ray.intersectObjects(obstacles.filter(o=>o!==source),false)[0];enemyBolt(a,impact?impact.point:b,e.type,!impact&&(e.type!==2||onSameFace),1,e)}}}
for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.userData.life-=dt;if(e.userData.bolt){let u=e.userData;u.elapsed+=dt;e.position.lerpVectors(u.start,u.end,Math.min(1,u.elapsed/u.duration));if(u.elapsed>=u.duration){if(u.willHit && (!u.sourceEnemy||u.sourceEnemy.hp>0) && (u.sourceEnemy?.type===2?player.flat&&sameSurface(u.sourceEnemy):!player.flat))hurt(u.damage);spark(u.end,u.color,5);u.life=0}}
else if(e.userData.v)e.position.addScaledVector(e.userData.v,dt);
if(e.userData.life<=0){scene.remove(e);e.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.dispose)o.material.dispose()});effects.splice(i,1)}}
document.getElementById('count').textContent='ENEMIES '+enemies.filter(e=>e.hp>0).length}
let running=false,last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.035,(t-last)/1000);last=t;if(running&&!paused)update(dt);
else if(gameOver){for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.userData.life-=dt;if(e.userData.v)e.position.addScaledVector(e.userData.v,dt);if(e.userData.life<=0){scene.remove(e);effects.splice(i,1)}}}
renderer.render(scene,cam)}loop(last);
document.getElementById('menuOptionButton').onclick=()=>{const el=document.getElementById('menuOptions');el.style.display=el.style.display==='block'?'none':'block'};
function syncMenuVolume(which,v){
 const isMusic=which==='music',id=isMusic?'musicVolume':'volume';
 document.getElementById(id).value=v;
 document.getElementById(isMusic?'musictext':'voltext').textContent=v+'%';
 if(isMusic){musicVolume=v/100;if(musicGain&&audio)musicGain.gain.setTargetAtTime(musicVolume,audio.currentTime,.04)}
 else volume=v/100;
 document.getElementById(isMusic?'menuMusicText':'menuSfxText').textContent=v+'%';
}
document.getElementById('menuSfx').oninput=e=>syncMenuVolume('sfx',+e.target.value);
document.getElementById('menuMusic').oninput=e=>syncMenuVolume('music',+e.target.value);
const narrationText='당신은 이 세상의 버그들을 없애기 위해 깊은 컴퓨터 세상속으로 들어왔습니다. 버그들은 저 멀리 보이는 메인 시스템을 향해 나아가고 있습니다. 차원을 넘어 모든 버그들을 해치우고 살아남으세요. 푸른 디버거들이 도와줄 겁니다.';
function showNarration(){
 const el=document.getElementById('narration');el.textContent=narrationText;el.style.opacity='1';el.style.display='block';
 setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.style.display='none',1000)},9000);
}
document.getElementById('go').onclick=()=>{showNarration();document.getElementById('menu').style.display='none';running=true;startMusic();renderer.domElement.requestPointerLock?.()};
renderer.domElement.addEventListener('mousedown',e=>{if(e.button!==0||!running||paused)return;shoot();if(!player.flat&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock?.()});
document.addEventListener('mousemove',e=>{pointer.px=e.clientX;pointer.py=e.clientY;pointer.x=e.clientX/innerWidth*2-1;pointer.y=1-e.clientY/innerHeight*2;if(player.flat){aim.style.left=e.clientX+'px';aim.style.top=e.clientY+'px'}else{aim.style.left='50%';aim.style.top='50%'}if(!running||player.flat||document.pointerLockElement!==renderer.domElement)return;player.yaw-=e.movementX*.0022;player.pitch=T.MathUtils.clamp(player.pitch-e.movementY*.0022,-1.45,1.45);cam3.rotation.y=player.yaw;cam3.rotation.x=player.pitch});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyP'&&!e.repeat&&running&&!gameOver)pause(!paused);if(e.code==='KeyE'&&!e.repeat&&running&&!paused)toggle()});document.addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam3.aspect=innerWidth/innerHeight;cam3.updateProjectionMatrix();cam2.left=-10*innerWidth/innerHeight;cam2.right=10*innerWidth/innerHeight;cam2.top=10;cam2.bottom=-10;cam2.updateProjectionMatrix()});dispatchEvent(new Event('resize'));
</script></body></html>
